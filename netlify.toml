[build]
publish = "public"
command = "hugo --gc --minify"

[context.production.environment]
HUGO_VERSION = "0.142.0"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.split1]
command = "hugo --gc --minify --enableGitInfo"

[context.split1.environment]
HUGO_VERSION = "0.142.0"
HUGO_ENV = "production"

[context.deploy-preview]
command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.deploy-preview.environment]
HUGO_VERSION = "0.142.0"

[context.branch-deploy]
command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
HUGO_VERSION = "0.142.0"

[context.next.environment]
HUGO_ENABLEGITINFO = "true"

# La portada en inglés todavía era el sitio anterior, con la marca vieja
# ("Best Place to Code"). Hasta que exista una portada en inglés del diseño
# 2027, /en/ manda a la portada nueva. Es 302 a propósito: el día que la haya,
# se quita esta regla y nada más queda roto.
# Solo la portada: las páginas internas en inglés siguen alcanzables.
[[redirects]]
  from = "/en/"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "https://bestplacetocode.com"
  to = "https://bestplacetocreate.com"
  status = 301
  force = true