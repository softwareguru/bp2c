<form id="contacto" class="form-contacto"
      action="https://docs.google.com/forms/d/e/1FAIpQLScCNhhaFvAefpe0NUETnA-h9QUNC_wdPW-9RfVhISd3p7YxeQ/formResponse"
      method="POST" target="hidden_iframe">

  <label for="interes">Me interesa *</label>
  <select id="interes" name="entry.2043203638" required>
    <option value="Evaluar a mi organización">Evaluar a mi organización</option>
    <option value="Recomendar una organización">Recomendar una organización</option>
    <option value="Prensa o alianzas">Prensa o alianzas</option>
  </select>

  <fieldset>
    <legend>Quién eres</legend>
    <label for="nombre">Nombre *</label>
    <input id="nombre" name="entry.1703096167" required>

    <label for="correo">Correo de trabajo *</label>
    <input id="correo" name="entry.1574457905" type="email" required>
  </fieldset>

  <fieldset>
    <legend>Tu organización</legend>
    <label for="org">Organización *</label>
    <input id="org" name="entry.770527947" required>

    <label for="puesto">Tu puesto</label>
    <input id="puesto" name="entry.754306744">

    <label for="tamano">Tamaño de tu equipo de tecnología</label>
    <select id="tamano" name="entry.733970373">
      <option value="">Selecciona una opción</option>
      <option>Menos de 10</option>
      <option>Entre 10 y 100</option>
      <option>Entre 101 y 200</option>
      <option>Más de 200</option>
    </select>
  </fieldset>

  <label for="comentarios">¿Hay algo que debamos saber antes de llamarte?</label>
  <textarea id="comentarios" name="entry.783181383" rows="4"></textarea>

  <!-- Honeypot antispam -->
  <input type="text" name="website" tabindex="-1" autocomplete="off"
         style="position:absolute;left:-9999px" aria-hidden="true">

  <button type="submit">Enviar</button>
  <p class="nota">Te escribimos al correo que dejes. Consulta el
    <a href="/privacidad/">aviso de privacidad</a>.</p>
</form>

<div id="gracias" class="gracias" hidden>
  <h3>¡Gracias!</h3>
  <p>Recibimos tus datos y te escribiremos pronto.</p>
</div>

<iframe name="hidden_iframe" id="hidden_iframe" style="display:none"></iframe>

<script>
(function () {
  var form = document.getElementById('contacto');
  var gracias = document.getElementById('gracias');
  var iframe = document.getElementById('hidden_iframe');
  var enviado = false;

  // Preselecciona según ?interes=evaluar | recomendar | prensa
  var mapa = {
    evaluar: 'Evaluar a mi organización',
    recomendar: 'Recomendar una organización',
    prensa: 'Prensa o alianzas'
  };
  var p = new URLSearchParams(location.search).get('interes');
  if (mapa[p]) document.getElementById('interes').value = mapa[p];

  form.addEventListener('submit', function (e) {
    if (form.website.value) { e.preventDefault(); return; }
    enviado = true;
  });

  iframe.addEventListener('load', function () {
    if (!enviado) return;
    form.hidden = true;
    gracias.hidden = false;
    gracias.scrollIntoView({ behavior: 'smooth' });
  });
})();
</script>

<style>
  .form-contacto { display: grid; gap: .5rem; max-width: 560px; }
  .form-contacto fieldset { border: 0; padding: 0; margin: .5rem 0; display: grid; gap: .5rem; }
  .form-contacto legend { font-weight: 600; margin-bottom: .25rem; }
  .form-contacto input, .form-contacto select, .form-contacto textarea {
    width: 100%; padding: .65rem .75rem; border: 1px solid #ccc;
    border-radius: 6px; font: inherit; box-sizing: border-box;
  }
  .form-contacto button {
    padding: .8rem 1.2rem; border: 0; border-radius: 6px; cursor: pointer;
    background: #012233; color: #fff; font: inherit; font-weight: 600;
  }
  .form-contacto .nota { font-size: .85rem; color: #666; }
  .gracias { padding: 1.5rem; border: 1px solid #ccc; border-radius: 8px; max-width: 560px; }
  [hidden] { display: none !important; }
</style>
