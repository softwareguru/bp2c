{{- /* Iconografía de marca. SVG en línea: heredan el color y no piden una
       petición extra. Los nombres salen del sistema de diseño. */ -}}
{{- $name := .name | default "crear" -}}
{{- $size := .size | default 32 -}}
{{- $color := .color | default "currentColor" -}}
{{- $label := .label -}}
<svg width="{{ $size }}" height="{{ $size }}" viewBox="0 0 {{ if eq $name "despegue" }}32 32{{ else }}24 24{{ end }}" fill="none"
  {{ if $label }}role="img" aria-label="{{ $label }}"{{ else }}aria-hidden="true"{{ end }} focusable="false">
{{- if eq $name "despegue" -}}
  <path d="M20 4c4 2 7 6 7 11 0 6-5 11-10 14-1-3-2-5-4-7s-4-3-7-4C9 13 14 7 20 4z" fill="{{ $color }}"/>
  <path d="M9 22c-2 1-3 3-3 6 3 0 5-1 6-3" stroke="#BFD8EF" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="19" cy="13" r="3" fill="#08293A"/>
{{- else if eq $name "destello" -}}
  <path d="M12 1l2.8 7.2L22 11l-7.2 2.8L12 21l-2.8-7.2L2 11l7.2-2.8z" fill="{{ $color }}"/>
{{- else if eq $name "exploracion" -}}
  <path d="M15 4c-6 0-9 5-9 10 0 4 2 6 5 6 5 0 7-13 2-13-3 0-4 4-4 7" stroke="{{ $color }}" stroke-width="2.2" stroke-linecap="round"/>
{{- else if eq $name "crear" -}}
  <path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9L4.9 19.1" stroke="{{ $color }}" stroke-width="2.8" stroke-linecap="round"/>
{{- else if eq $name "transformacion" -}}
  <path d="M3 16c2-6 4-8 6-4s4 2 6-4 4-4 6 0" stroke="{{ $color }}" stroke-width="2.2" stroke-linecap="round"/>
{{- else if eq $name "check" -}}
  <path d="M4 12.5l5 5L20 6.5" stroke="{{ $color }}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
{{- else if eq $name "cruz" -}}
  <path d="M6 6l12 12M18 6L6 18" stroke="{{ $color }}" stroke-width="2.6" stroke-linecap="round"/>
{{- else if eq $name "chevron" -}}
  <path d="M6 9l6 6 6-6" stroke="{{ $color }}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
{{- else if eq $name "play" -}}
  <path d="M8 5l12 7-12 7z" fill="{{ $color }}"/>
{{- else if eq $name "flecha" -}}
  <path d="M5 12h13M12 6l6 6-6 6" stroke="{{ $color }}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
{{- end -}}
</svg>
