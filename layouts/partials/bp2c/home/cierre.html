{{- /* Sección «cierre» de la portada 2027. Marcado del diseño aprobado.
       El CTA sale de data/bp2c/global.yaml. */ -}}
{{- $g := site.Data.bp2c.global -}}
<section style="background: #C0D6EB; padding: 120px 32px; position: relative; overflow: hidden;">
<div style="max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px; align-items: center; justify-content: space-between;">
<div style="flex: 1 1 600px; min-width: 0;">
<h2 style="margin: 0; font-weight: 800; font-size: clamp(48px, 7vw, 112px); line-height: 1.02; letter-spacing: -0.045em;">¿Tu equipo te daría<br><span class="hand sticker" style="font-weight: 400; white-space: nowrap; margin-top: .14em;">el sello?</span></h2>
<p style="margin: 28px 0 0; font-size: 22px; line-height: 1.5;">Hay una forma de saberlo. Evalúate antes del 15 de enero.</p>
<a href="{{ $g.cta_principal.url }}" class="btn" style="display: inline-block; margin-top: 36px; background: #012233; color: #B1D635; text-decoration: none; font-weight: 800; font-size: 20px; padding: 20px 32px; border-radius: 999px;">{{ $g.cta_principal.texto }}</a>
</div>
<img class="spin sello-cierre" src="/images/home/sello-cierre.png" alt="" aria-hidden="true">
</div>
</section>
