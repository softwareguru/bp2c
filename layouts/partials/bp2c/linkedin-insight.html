{{- /* LinkedIn Insight Tag, para medir las campañas de LinkedIn Ads.
       El ID del socio vive en hugo.toml (params.linkedinPartnerId); si se
       borra, el tag deja de cargarse en todo el sitio. */ -}}
{{- with site.Params.linkedinPartnerId }}
<script type="text/javascript">
_linkedin_partner_id = "{{ . }}";
window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || [];
window._linkedin_data_partner_ids.push(_linkedin_partner_id);
</script>
<script type="text/javascript">
(function(l) {
if (!l){window.lintrk = function(a,b){window.lintrk.q.push([a,b])};
window.lintrk.q=[]}
var s = document.getElementsByTagName("script")[0];
var b = document.createElement("script");
b.type = "text/javascript";b.async = true;
b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js";
s.parentNode.insertBefore(b, s);})(window.lintrk);
</script>
<noscript>
<img height="1" width="1" style="display:none;" alt="" src="https://px.ads.linkedin.com/collect/?pid={{ . }}&fmt=gif" />
</noscript>
{{- end }}
