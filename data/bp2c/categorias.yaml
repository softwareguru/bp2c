# Categorías de reconocimiento, en el orden en que se muestran.
# El slug corresponde al campo `tipo-empresa` del frontmatter de cada perfil.
# `ancla` es el id de la sección en el directorio: así los enlaces del filtro
# son legibles y estables aunque el slug interno cambie.
# `descripcion` es la frase completa, que usa el directorio de acreditadas.
# `tamano` y `resumen` la parten en etiqueta y descripción corta, que es como
# las pide la página Para organizaciones.
