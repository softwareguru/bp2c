# Testimonios en vídeo del canal de Software Guru.
# Los títulos y las miniaturas son los reales del vídeo; las miniaturas están
# descargadas en assets/ para que Hugo genere WebP y el reposo no haga
# ninguna petición a YouTube.
#
# PENDIENTE: la cita de cada tarjeta. Mientras `cita` esté vacía, la tarjeta
# muestra el título real del vídeo. La frase que convierte es la que nombra un
# resultado concreto, y hay que sacarla viendo cada vídeo; no se inventa aquí.
#
# PENDIENTE: confirmar en YouTube Studio que los tres tienen subtítulos en
# español y revisados. El criterio 1.2.2 de WCAG es nivel A: sin subtítulos,
# publicar estos vídeos deja al sitio fuera de norma. No se puede comprobar
# desde fuera del canal.
publicar: true

kicker: "Testimonios"
titulo: "Lo que cuentan quienes ya pasaron por el proceso"
entrada: "No lo que opinamos nosotros: lo que dicen las organizaciones que se evaluaron y se acreditaron."
nota: "Estos testimonios se grabaron en el ciclo de Best Place to Code, la acreditación que evoluciona a Best Place to Create."

