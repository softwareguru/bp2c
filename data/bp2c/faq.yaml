# Preguntas frecuentes. Agrupadas por tema; generan el schema FAQPage.
# El `id` permite reusar una pregunta en otra página (Cómo funciona usa tres).
# Las preguntas bloqueadas por D13 y D14 no están aquí: no se publican
# hasta resolver la vigencia de la acreditación y el mecanismo de validación.
grupos:
  - nombre: "Sobre el programa"
    preguntas:
      - id: "que-es"
        p: "¿Qué es Best Place to Create?"
        r: "Es el estándar de diagnóstico y acreditación para organizaciones tech en Latinoamérica. Tus personas de tecnología evalúan, de forma anónima, su entorno de trabajo; si tu organización cumple el criterio, puede acreditarse. Es una iniciativa de Software Guru."
      - id: "diferencia-bptc"
        p: "¿En qué se diferencia de Best Place to Code?"
        r: "Es su evolución. Se mantienen la evaluación anónima, el criterio exigente y el listado anual. Se suman la medición de cómo se habilita la IA y cómo se gestiona la tecnoansiedad, la Radiografía del Empleador con acciones recomendadas y la comparación con tu cohorte."
      - id: "quien-participa"
        p: "¿Qué tipo de organizaciones pueden participar?"
        r: "Organizaciones de cualquier tamaño y sector que tengan un equipo de tecnología: organizaciones con producto propio, startups, consultorías, corporativos e instituciones. Cada una compite en una de cinco categorías de reconocimiento."
      - id: "mide-creatividad"
        p: "¿Mide qué tan creativas son las personas o qué tanto usan IA?"
        r: "No. Diagnostica las condiciones que crea la organización para que su talento técnico pueda aprender, aportar, colaborar y crear valor."
  - nombre: "La evaluación"
    preguntas:
      - id: "quien-responde"
        p: "¿Quién responde la evaluación?"
        r: "Las personas de tecnología de tu organización, con el Kit de despliegue que te entregamos al contratar."
      - id: "anonimato"
        p: "¿Las respuestas son anónimas?"
        r: "Sí. Además, con menos de 10 respuestas el dashboard muestra los resultados en rangos más amplios, para que nadie pueda ser identificado."
      - id: "duracion"
        p: "¿Cuánto dura la evaluación?"
        r: "Dos semanas. En el ciclo 2027 las respuestas cierran el 22 de enero."
      - id: "que-mide"
        p: "¿Qué mide?"
        r: "Seis categorías. Fundamentos decide la acreditación; Habilitación de IA, Gestión de Tecno-Ansiedad, Justicia Algorítmica, Agencia del Empleado y Confianza en el Futuro son palancas que señalan dónde actuar."
  - nombre: "Acreditación y pagos"
    preguntas:
      - id: "pago-garantiza"
        p: "¿Pagar la evaluación garantiza la acreditación?"
        r: "No. La evaluación da acceso al diagnóstico. La acreditación depende de cumplir el criterio en Fundamentos y se paga aparte."
      - id: "criterio"
        p: "¿Cuál es el criterio para acreditarse?"
        r: "85 % de promedio agregado en Fundamentos y mínimo 75 % en cada uno de sus 14 reactivos."
      - id: "costo"
        p: "¿Cuánto cuesta?"
        r: "Depende del tamaño de tu equipo de tecnología. Son dos pagos: la evaluación y, si cumples el criterio, la acreditación. Te compartimos la propuesta en una llamada."
      - id: "fechas"
        p: "¿Cuáles son las fechas del ciclo 2027?"
        r: "Te sugerimos contratar tu evaluación antes del 8 de enero. El último día para pagarla es el 15 de enero. Las respuestas cierran el 22 de enero, el último día para pagar la acreditación es el 29 de enero y el Listado 2027 se publica el 4 de febrero."
      - id: "no-alcanzamos"
        p: "¿Qué pasa si no alcanzamos el criterio?"
        r: "Recibes tu Dashboard de monitoreo y un análisis corto de las palancas. Puedes evaluarte de nuevo sin costo; ese segundo intento cuenta para el siguiente ciclo."
      - id: "publican-resultados"
        p: "¿Se publican los resultados de quienes no se acreditan?"
        r: "No. El directorio y el Listado 2027 incluyen solo organizaciones acreditadas."
      - id: "renovacion"
        p: "¿Cómo funciona la renovación?"
        r: "La evaluación de renovación no tiene costo. Si tu organización vuelve a cumplir el criterio, paga su acreditación a más tardar el 29 de enero."
      - id: "numero-uno"
        p: "¿Podemos anunciarnos como #1 de nuestra categoría?"
        r: "No. El reconocimiento se comunica con el nombre oficial del listado; las posiciones por categoría no se publican como ranking independiente."
  - nombre: "Para personas de tecnología"
    preguntas:
      - id: "que-me-dice"
        p: "¿Qué me dice que una organización esté acreditada?"
        r: "Que sus propias personas de tecnología calificaron, de forma anónima, los aspectos fundamentales de su entorno con al menos 85 % de promedio y ninguno por debajo de 75 %."
      - id: "proponer"
        p: "¿Cómo puedo proponer a mi organización?"
        r: "Compártele esta página a tu líder o al equipo de talento, o déjanos sus datos en el formulario de contacto."

# No publicar hasta resolver. Quedan fuera del acordeón y del schema.
en_espera:
