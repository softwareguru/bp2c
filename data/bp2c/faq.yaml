# Preguntas frecuentes. Agrupadas por tema; generan el schema FAQPage.
# El `id` permite reusar una pregunta en otra página (Cómo funciona usa tres).
# Las preguntas bloqueadas por D13 y D14 no están aquí: no se publican
# hasta resolver la vigencia de la acreditación y el mecanismo de validación.
grupos:
  - nombre: "Sobre el programa"
    preguntas:
      - id: "que-es"
        p: "¿Qué es Best Place to Create?"
        r: "Tus personas de tecnología califican su entorno de trabajo en una evaluación anónima. Tú recibes un diagnóstico con las áreas donde conviene actuar y, si tu organización alcanza el criterio, puede acreditarse y usar el sello. Es una iniciativa de Software Guru."
      - id: "diferencia-bptc"
        p: "¿En qué se diferencia de Best Place to Code?"
        r: "Es el mismo programa con más alcance. Se mantienen la evaluación anónima, el criterio y el ranking anual. Se suma lo que antes no medíamos: si tu equipo tiene herramientas y permisos para usar IA, y cómo acompañas la incertidumbre que trae el cambio tecnológico. Y el reporte ahora llega con acciones recomendadas y con la comparación contra tu cohorte y contra el mercado de SG Tech Pulse."
      - id: "quien-participa"
        p: "¿Qué tipo de organizaciones pueden participar?"
        r: "Cualquier organización con un equipo de tecnología, sin importar su tamaño ni su sector: startups y empresas de producto, consultorías, corporativos e instituciones. Cada una compite en una de cinco categorías, para no medirse contra organizaciones que no se le parecen."
      - id: "mide-creatividad"
        p: "¿Mide qué tan creativas son las personas o qué tanto usan IA?"
        r: "No. No evaluamos a las personas ni cuánta IA usan. Evaluamos lo que la organización pone de su parte: si su gente tiene con qué aprender, margen para decidir y un entorno donde aportar."
  - nombre: "La evaluación"
    preguntas:
      - id: "quien-responde"
        p: "¿Quién responde la evaluación?"
        r: "Tus personas de tecnología. Al contratar te damos el Kit de despliegue, con los materiales y el enlace para invitarlas."
      - id: "anonimato"
        p: "¿Las respuestas son anónimas?"
        r: "Sí. Tú ves calificaciones, nunca respuestas individuales. Y si responden menos de 10 personas, los resultados se muestran en rangos amplios, para que nadie pueda ser identificado por descarte."
      - id: "duracion"
        p: "¿Cuánto dura la evaluación?"
        r: "Tu equipo tiene dos semanas para responder. En el ciclo 2027 las respuestas cierran el 11 de febrero."
      - id: "que-mide"
        p: "¿Qué mide?"
        r: "Seis categorías. Una se llama Fundamentos y es la única que decide la acreditación: son 14 preguntas sobre lo básico del entorno de trabajo. Las otras cinco no deciden nada, te dicen dónde actuar: Habilitación de IA, Gestión de Tecno-Ansiedad, Justicia Algorítmica, Agencia del Empleado y Confianza en el Futuro."
      - id: "con-quien-comparan"
        p: "¿Con quién se compara mi organización?"
        r: "Con tres referencias. Tu ciclo anterior, si ya participaste: las 14 preguntas de Fundamentos no cambian, así que tu dashboard te muestra cómo se movió cada una. La cohorte 2027: todas las organizaciones que se evalúan en el ciclo, se acrediten o no; ves la distribución y cuántas organizaciones la forman, nunca los resultados de otra. Y el mercado: varias preguntas tienen la misma redacción que SG Tech Pulse, la encuesta abierta de Software Guru, así que te comparamos con quienes la respondieron en organizaciones de tamaño y modalidad de trabajo parecidos. Las comparaciones con la cohorte y con el mercado vienen en la Radiografía del Empleador, exclusiva de las organizaciones acreditadas."

      - id: "mezcla-tech-pulse"
        p: "¿Mezclan nuestras respuestas con las de SG Tech Pulse?"
        r: "No. Todas las comparaciones usan resultados agregados, y nunca ligamos las respuestas de una persona en Best Place to Create con sus respuestas en SG Tech Pulse. Un grupo del mercado con menos de 30 respuestas no se muestra. Y el detalle depende de cuántas personas respondan en tu organización: con 20 o más comparamos cifra contra cifra; de 10 a 19, distribuciones; con menos de 10, solo resultados generales."

  - nombre: "Acreditación y pagos"
    preguntas:
      - id: "pago-garantiza"
        p: "¿Pagar la evaluación garantiza la acreditación?"
        r: "No. Lo que compras con el primer pago es el diagnóstico. La acreditación depende de lo que respondan tus personas de tecnología: si alcanzas el criterio en Fundamentos, puedes acreditarte, y eso se paga aparte."
      - id: "criterio"
        p: "¿Cuál es el criterio para acreditarse?"
        r: "Dos condiciones, las dos sobre Fundamentos: 85 % de promedio y ninguna de sus 14 preguntas por debajo de 75 %. Es decir, no basta un promedio alto si una pregunta sale muy baja."
      - id: "costo"
        p: "¿Cuánto cuesta?"
        r: "Depende de cuántas personas de tecnología tenga tu organización. Son dos pagos: primero la evaluación, y solo si alcanzas el criterio, la acreditación. Te pasamos la propuesta en una llamada, sin compromiso."
      - id: "fechas"
        p: "¿Cuáles son las fechas del ciclo 2027?"
        r: "El último día para pagar la evaluación es el 28 de enero y las respuestas cierran el 11 de febrero. Si alcanzas el criterio, tienes hasta el 15 de febrero para pagar la acreditación. El Ranking 2027 se publica el 18 de febrero, y las organizaciones acreditadas reciben su Radiografía del Empleador a finales de marzo."
      - id: "no-alcanzamos"
        p: "¿Qué pasa si no alcanzamos el criterio?"
        r: "Te quedas con el diagnóstico completo, que es la parte que sirve para mejorar: la calificación por categoría y un análisis de las cinco áreas donde actuar. Puedes volver a evaluarte sin costo, y ese segundo intento cuenta para el siguiente ciclo."
      - id: "publican-resultados"
        p: "¿Se publican los resultados de quienes no se acreditan?"
        r: "No. Solo se publica quién se acreditó. Si tu organización no alcanza el criterio, el resultado es tuyo y de nadie más."
      - id: "renovacion"
        p: "¿Cómo funciona la renovación?"
        r: "Vuelves a evaluarte sin costo. Si tu organización alcanza otra vez el criterio, pagas la acreditación a más tardar el 15 de febrero y sigues en el ranking."
      - id: "numero-uno"
        p: "¿Cómo anunciamos nuestro lugar en el ranking?"
        r: "Siempre con el nombre oficial del ranking y tu categoría, nunca como un ranking aparte. El Kit de acreditación trae las frases correctas."
  - nombre: "Para personas de tecnología"
    preguntas:
      - id: "que-me-dice"
        p: "¿Qué me dice que una organización esté acreditada?"
        r: "Que la gente que trabaja ahí calificó su propio entorno en anónimo, y que esa calificación pasó un criterio público: 85 % de promedio y ninguna pregunta por debajo de 75 %. No lo decidió el equipo de marketing."
      - id: "proponer"
        p: "¿Cómo puedo proponer a mi organización?"
        r: "Mándale esta página a tu líder o a quien lleve talento. Si prefieres no hacerlo tú, déjanos sus datos y los contactamos nosotros."

